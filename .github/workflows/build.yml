name: Android CI/CD Auto-Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Configure Optional Build Secrets
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      run: |
        python3 - << 'PY'
        import os
        with open(".env.example", "r", encoding="utf-8") as f:
            lines = f.read().splitlines()
        env_url = (os.environ.get("NEXT_PUBLIC_SUPABASE_URL") or os.environ.get("SUPABASE_URL") or "").strip()
        env_key = (
            os.environ.get("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
            or os.environ.get("SUPABASE_PUBLISHABLE_KEY")
            or os.environ.get("NEXT_PUBLIC_SUPABASE_ANON_KEY")
            or os.environ.get("SUPABASE_ANON_KEY")
            or ""
        ).strip()
        env_google = (os.environ.get("GOOGLE_WEB_CLIENT_ID") or "").strip()
        overrides = {
            "NEXT_PUBLIC_SUPABASE_URL": (os.environ.get("NEXT_PUBLIC_SUPABASE_URL") or env_url).strip(),
            "SUPABASE_URL": (os.environ.get("SUPABASE_URL") or env_url).strip(),
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY": (os.environ.get("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY") or os.environ.get("SUPABASE_PUBLISHABLE_KEY") or env_key).strip(),
            "SUPABASE_ANON_KEY": (os.environ.get("SUPABASE_ANON_KEY") or os.environ.get("NEXT_PUBLIC_SUPABASE_ANON_KEY") or env_key).strip(),
            "GOOGLE_WEB_CLIENT_ID": env_google,
        }
        out = []
        for line in lines:
            if "=" in line and not line.lstrip().startswith("#"):
                k = line.split("=", 1)[0].strip()
                if overrides.get(k):
                    out.append(f"{k}={overrides[k]}")
                    continue
            out.append(line)
        with open(".env", "w", encoding="utf-8") as f:
            f.write("\n".join(out) + "\n")
        PY

    - name: Build Debug APK
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      run: gradle assembleDebug --no-daemon --no-configuration-cache

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusLock-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
